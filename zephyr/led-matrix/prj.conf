# The matrix is reached through the display API, so the display subsystem has to
# be in. The charlieplex driver itself needs nothing here: its Kconfig defaults
# to y once the devicetree node is enabled, which this board already does, and
# it selects GPIO and COUNTER for itself.
CONFIG_DISPLAY=y

# Console on lpuart1, which is the internal link to the Qualcomm side, so the
# boot banner and anything this prints are readable from Linux on /dev/ttyHS1.
# The overlay in boards/ is what points the console there: the board's own
# devicetree chooses no console at all, so without it there is no output
# anywhere and a working build looks like a dead one.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
