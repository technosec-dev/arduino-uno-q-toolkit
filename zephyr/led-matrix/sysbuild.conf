# One build, two images: MCUboot at the start of flash and this application
# signed into its slot 0.
#
# This matters for flashing. A signed application is not bootable on its own,
# and the two halves have to come from the same build: the bootloader embeds the
# public key its own key pair generated, and they agree on where slot 0 begins.
# Mixing halves from two builds leaves an image MCUboot will not validate, and
# nothing says so out loud.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
