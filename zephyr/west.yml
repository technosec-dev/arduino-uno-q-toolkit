# West manifest for building this application without EmbedForge.
#
# Pinned to v4.5.0-rc1 on purpose. That is the first Zephyr tag whose
# arduino_uno_q devicetree describes the LED matrix: v4.4.2 carries the board
# but has no charlieplex-led-matrix node and no zephyr,display, so this
# application does not build against it at all. v4.5.0-rc1 is a release
# candidate, with whatever that implies; there is no stable tag with the matrix
# at the time of writing.
#
# import: true pulls in the modules that revision expects, which is where
# hal_stm32 comes from for this SoC and mcuboot for the sysbuild bootloader.
# Neither is in a group that Zephyr's own group-filter disables.
manifest:
  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.5.0-rc1
      import: true

  self:
    path: arduino-uno-q-toolkit
