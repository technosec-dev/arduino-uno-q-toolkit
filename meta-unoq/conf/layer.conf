# Layer configuration for meta-unoq.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "unoq"
BBFILE_PATTERN_unoq = "^${LAYERDIR}/"
BBFILE_PRIORITY_unoq = "8"

# Only wrynose is tested. The recipes here are plain enough that older series
# should work, and the README says which is which rather than implying every
# entry in this list has been built.
LAYERSERIES_COMPAT_unoq = "scarthgap styhead walnascar whinlatter wrynose"

# The openocd bbappend needs meta-oe, which is where openocd and libgpiod live.
LAYERDEPENDS_unoq = "openembedded-layer"
