# The board has no ethernet port, no console connector and one USB-C socket, so
# a CDC-ECM + CDC-ACM gadget is how a host reaches it at all. These are the
# symbols that gadget needs built in.
#
# CONFIG_USB_CONFIGFS is the lever and the rest are assertions. LIBCOMPOSITE,
# USB_F_ECM and USB_F_ACM have no prompt of their own: Kconfig answers them with
# whatever selects them, so setting them in a fragment does nothing on its own.
# Asking for LIBCOMPOSITE=y alone leaves it at =m, the gadget script's modprobe
# is then the only thing standing between the board and being unreachable, and
# on this image that modprobe ran inside a systemd sandbox that forbade it.
# USB_CONFIGFS does have a prompt, and USB_GADGET is already =y on this machine,
# so =y is reachable. The three lines below then hold the lever to account.
CONFIG_USB_CONFIGFS=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_F_ECM=y
CONFIG_USB_F_ACM=y

# Lets the kernel put a console on a gadget serial port. Cheap, and a console
# over the USB-C cable is the only way to watch this board fail without wiring
# up the 1.8 V header.
#
# Deliberately NOT CONFIG_USB_G_SERIAL. The legacy g_serial gadget binds the UDC
# at init and this board has exactly one, so it would lock out the configfs
# gadget that provides both the network link and the login shell.
CONFIG_U_SERIAL_CONSOLE=y
