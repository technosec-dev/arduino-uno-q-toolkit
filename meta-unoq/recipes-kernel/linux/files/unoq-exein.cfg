# Pulsar's own kernel requirements, restated here because meta-exein cannot
# deliver them to this BSP.
#
# meta-exein ships recipes-kernel/linux/files/btf.cfg listing 21 symbols and
# wires it in through btf.scc, from linux-%_btf.inc. A .scc is a kernel-yocto
# construct. linux-qcom is not a kernel-yocto recipe, it has no .kernel-meta, so
# the .scc is fetched into the kernel workdir and then ignored completely and
# none of btf.cfg is merged. Nothing warns. The build is green, Pulsar starts,
# and its eBPF LSM path is silently gone.
#
# A plain .cfg in SRC_URI, which is what this file becomes, IS merged by this
# recipe. Of meta-exein's 21 symbols the meta-qcom defconfig already provides
# 17; these are the ones it does not.
#
# Without BPF_LSM and SECURITY_NETWORK, Pulsar reports
#
#   WARN bpf_feature_autodetect::lsm] LSM not supported: Load failed
#           Unknown BTF type `bpf_lsm_socket_bind`
#
# and falls back to kprobes. Its probe loads one BPF LSM program on the
# socket_bind hook, and every socket LSM hook sits behind SECURITY_NETWORK: with
# it unset the kernel BTF held 216 bpf_lsm_* symbols and not one
# bpf_lsm_socket*, so the single hook Pulsar tests was in the one family
# compiled out. Setting these took it to 816 bpf_lsm_* symbols, 51 of them
# bpf_lsm_socket*, and the warning disappeared.
CONFIG_BPF_LSM=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_PATH=y
CONFIG_FTRACE_SYSCALLS=y

# The fifth symbol meta-exein asks for and the defconfig omits is
# DEBUG_INFO_DWARF5, left out on purpose: it selects only a debug-info format,
# and BTF generates correctly without it (/sys/kernel/btf/vmlinux is present and
# complete). Add it if you want DWARF5 for other reasons.
