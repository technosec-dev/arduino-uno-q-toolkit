# OpenOCD adapter configuration for the Arduino UNO Q's STM32U585.
#
# The MCU has no external SWD pins. Its debug lines are wired to GPIOs of the
# QRB2210 application processor, so the board programs its own microcontroller:
# Linux drives SWD by bitbanging those GPIOs through libgpiod.
#
# The pin map is the board's, not a choice. It matches the configuration
# Arduino's own factory image ships, which is the authority for how this
# hardware is wired.

adapter driver linuxgpiod

adapter gpio srst  38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
adapter gpio trst  38 -chip 1

transport select swd

# OpenOCD ships the target description for this part.
source [find target/stm32u5x.cfg]

# Drop the probe-clock changes the STM32 target scripts ask for.
#
# OpenOCD's stm32x5x_common.cfg boosts the adapter clock around reset, and
# stm32u5x.cfg boosts it again once the PLL is up:
#
#     $_TARGETNAME configure -event reset-start { adapter speed 480 }
#     $_TARGETNAME configure -event reset-init  { ...; adapter speed 4000 }
#
# Both assume a probe with a programmable clock. This one has no clock at all:
# SWD is bitbanged from GPIOs, and OpenOCD says so itself at startup, "Note: the
# adapter linuxgpiod doesn't support configurable speed". The driver therefore
# implements no khz conversion, so adapter_khz_to_speed() fails and takes the
# whole event with it:
#
#     Error: Translation from khz to adapter speed not implemented
#     Error: [stm32u5x.cpu] Execution of event reset-start failed
#
# which aborts every reset and so every flash. Re-declare both events without
# the speed calls. reset-start had nothing else in it. reset-init's clock
# configuration is worth keeping: it brings the MCU to 160 MHz, which is the
# part that actually makes flashing quick here.
$_TARGETNAME configure -event reset-start { }
$_TARGETNAME configure -event reset-init { stm32u5x_clock_config }
