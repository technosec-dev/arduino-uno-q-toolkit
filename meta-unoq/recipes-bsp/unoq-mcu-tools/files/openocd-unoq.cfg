# OpenOCD adapter configuration for the Arduino UNO Q's STM32U585.
#
# The MCU has no external SWD pins. Its debug lines are wired to GPIOs of the
# QRB2210 application processor, so the board programs its own microcontroller:
# Linux drives SWD by bitbanging those GPIOs through libgpiod.
#
# The pin map is the board's, not a choice. It matches the configuration
# Arduino's own factory image ships, which is the authority for how this
# hardware is wired.

adapter driver linuxgpiod

adapter gpio srst  38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
adapter gpio trst  38 -chip 1

transport select swd

# OpenOCD ships the target description for this part.
source [find target/stm32u5x.cfg]
